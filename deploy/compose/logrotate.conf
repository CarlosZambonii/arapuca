# Rotation for the Arapuca event log.
#
# `create` plus a signal, never `copytruncate`. copytruncate races with an
# appending writer: between the copy and the truncate, anything the honeypot
# writes is lost, and a partially written line can be duplicated. The daemon
# reopens its path on SIGHUP instead, which has no window.
#
# The path is a glob on purpose. Docker names a volume after the compose
# project, which is the basename of the directory the compose file sits in,
# so the real path is /var/lib/docker/volumes/arapuca_arapuca-logs/_data.
# This file said compose_arapuca-logs, which is the name it would have had
# if the stack lived in a directory called compose, and it does not: nothing
# ever matched, so the event log never rotated and grew without bound. A
# glob matches whatever the project is called and cannot drift again.
#
# Installed by Ansible at /etc/logrotate.d/arapuca.

/var/lib/docker/volumes/*_arapuca-logs/_data/events.jsonl {
    daily
    rotate 14
    # maxsize, not size: with `size` logrotate ignores the time interval
    # entirely, which it says out loud in a dry run, so "rotate 14" never
    # meant fourteen days. maxsize keeps the daily rotation and adds an
    # early one if a burst fills the file before the day is out.
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    # By name, not by uid. logrotate resolves these through the passwd
    # database and refuses the whole file with "unknown user" if it cannot,
    # which is what it was doing: 10001 is the container's user and the host
    # had never heard of it. Ansible now creates a matching system account,
    # so the rotated file belongs to the same uid the daemon writes as.
    create 0640 arapuca arapuca

    postrotate
        # The daemon is pid 1 in its container, so the signal goes through
        # docker rather than to a host process.
        /usr/bin/docker kill --signal=HUP arapuca > /dev/null 2>&1 || true
    endscript
}
