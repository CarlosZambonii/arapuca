# Dependency updates.
#
# Dependabot does not understand CMake FetchContent, so the native C++
# dependencies are handled by .github/workflows/deps-check.yml, which opens an
# issue when a pinned upstream tag falls behind.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The base image is a platform decision, not a floating dependency.
      # Ubuntu 24.04 is what CI, the container and the VPS all run, and it is
      # what pins libssh to 0.10.6. Moving it is a deliberate change with a
      # CI matrix and a VPS rebuild behind it, so Dependabot proposing 26.04
      # on a Monday is noise that would quietly break the one supported base.
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # One entry per configuration. Terraform has no single root here: the OCI
  # and New Relic stacks are separate, each with its own provider set, and a
  # directory with no configuration in it is an error rather than an empty
  # update.
  - package-ecosystem: "terraform"
    directory: "/deploy/terraform/oci"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "terraform"
    directory: "/deploy/terraform/newrelic"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
