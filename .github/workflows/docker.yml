name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/docker/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "cmake/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than QEMU. Compiling C++ under emulation
          # takes long enough that people stop waiting for it.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: arapuca:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # A honeypot that starts as root, or that can write its own filesystem,
      # is a different thing from the one this repository describes. These
      # assertions are the deployment contract.
      - name: Assert the hardening holds
        run: |
          set -euo pipefail

          echo "the daemon runs and reports its version"
          docker run --rm arapuca:ci --version

          echo "the image does not run as root"
          uid=$(docker run --rm --entrypoint id arapuca:ci -u)
          test "$uid" = "10001" || { echo "running as uid $uid"; exit 1; }

          echo "there is no shell interpreter for an escape to use"
          if docker run --rm --entrypoint /bin/sh arapuca:ci -c 'echo reachable' 2>/dev/null; then
            echo "note: a shell is present in the base image"
          fi

          echo "a read only root filesystem still starts"
          docker volume create ci-logs
          docker volume create ci-state
          docker volume create ci-quarantine
          docker run -d --name arapuca-ci \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -v ci-logs:/var/log/arapuca \
            -v ci-state:/var/lib/arapuca/state \
            -v ci-quarantine:/var/lib/arapuca/quarantine \
            -p 127.0.0.1:18080:8080 \
            arapuca:ci
          sleep 5
          docker logs arapuca-ci

          echo "the HTTP honeypot answers and serves a decoy"
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://127.0.0.1:18080/.env)
          test "$code" = "200" || { echo "got $code"; exit 1; }
          grep -q DB_PASSWORD /tmp/body || { echo "decoy content missing"; exit 1; }

          docker stop arapuca-ci
          docker rm arapuca-ci
          docker volume rm ci-logs ci-state ci-quarantine

      # A honeypot is a machine volunteered to the internet. Shipping it with
      # a known vulnerable library in the base image is the one way this
      # project could become the incident it is meant to observe.
      - name: Scan the image for known vulnerabilities
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arapuca:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Uploaded before the gate below, so the findings are readable in the
      # security tab even on the run that fails.
      - name: Upload the findings
        if: matrix.platform == 'linux/amd64'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-container

      - name: Fail on a fixable critical or high
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arapuca:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Write the software bill of materials
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arapuca:ci
          format: cyclonedx
          output: arapuca-sbom.cdx.json
          scanners: license

      - name: Upload the bill of materials
        if: matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: arapuca-sbom.cdx.json
          retention-days: 90

  publish:
    name: Publish multi-arch image
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A container registry rejects an uppercase repository name, and
      # github.repository keeps whatever case the owner's login has.
      - name: Work out the lowercase image name and the tags
        id: image
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

          # A build of main is :latest and its commit. A release tag is also
          # its own version, which is the only tag anyone can pin to and still
          # know what they are running.
          {
            echo "tags<<EOF"
            echo "ghcr.io/${name}:latest"
            echo "ghcr.io/${name}:${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "ghcr.io/${name}:${GITHUB_REF_NAME}"
              echo "ghcr.io/${name}:${GITHUB_REF_NAME#v}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless, against the transparency log: the signature is tied to this
      # workflow in this repository, with no private key to keep or to leak.
      # Anyone pulling the image can check where it was built, which for a
      # honeypot image is worth more than for most: running the wrong one
      # means running an unknown binary on a host that invites attackers.
      #
      #   cosign verify ghcr.io/<owner>/arapuca:latest \
      #     --certificate-identity-regexp '^https://github.com/<owner>/arapuca/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
