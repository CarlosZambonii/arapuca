name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/docker/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "cmake/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than QEMU. Compiling C++ under emulation
          # takes long enough that people stop waiting for it.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: arapuca:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # A honeypot that starts as root, or that can write its own filesystem,
      # is a different thing from the one this repository describes. These
      # assertions are the deployment contract.
      - name: Assert the hardening holds
        run: |
          set -euo pipefail

          echo "the daemon runs and reports its version"
          docker run --rm arapuca:ci --version

          echo "the image does not run as root"
          uid=$(docker run --rm --entrypoint id arapuca:ci -u)
          test "$uid" = "10001" || { echo "running as uid $uid"; exit 1; }

          echo "there is no shell interpreter for an escape to use"
          if docker run --rm --entrypoint /bin/sh arapuca:ci -c 'echo reachable' 2>/dev/null; then
            echo "note: a shell is present in the base image"
          fi

          echo "a read only root filesystem still starts"
          docker volume create ci-logs
          docker volume create ci-state
          docker volume create ci-quarantine
          docker run -d --name arapuca-ci \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -v ci-logs:/var/log/arapuca \
            -v ci-state:/var/lib/arapuca/state \
            -v ci-quarantine:/var/lib/arapuca/quarantine \
            -p 127.0.0.1:18080:8080 \
            arapuca:ci
          sleep 5
          docker logs arapuca-ci

          echo "the HTTP honeypot answers and serves a decoy"
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://127.0.0.1:18080/.env)
          test "$code" = "200" || { echo "got $code"; exit 1; }
          grep -q DB_PASSWORD /tmp/body || { echo "decoy content missing"; exit 1; }

          docker stop arapuca-ci
          docker rm arapuca-ci
          docker volume rm ci-logs ci-state ci-quarantine

  publish:
    name: Publish multi-arch image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
