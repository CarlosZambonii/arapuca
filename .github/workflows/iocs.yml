name: IoC feed

# Daily. The feed is only useful if it is current, and a honeypot's view of
# which addresses are active changes every day.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "NRQL window to export"
        required: false
        default: "1 day ago"

permissions:
  contents: write

concurrency:
  group: iocs
  cancel-in-progress: false

jobs:
  export:
    name: Export indicators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Export
        env:
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
        run: python tools/ioc_export.py --window "${{ inputs.window || '1 day ago' }}"

      - name: Commit the feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iocs/

          # A scheduled job that commits nothing every day fills the history
          # with noise, so only commit when something actually changed.
          if git diff --cached --quiet; then
            echo "no change in the feed today"
            exit 0
          fi

          ips=$(tail -n +2 iocs/latest-ips.csv | wc -l)
          hashes=$(tail -n +2 iocs/latest-hashes.csv | wc -l)
          git commit -m "chore(iocs): feed for $(date -u +%Y-%m-%d)" \
                     -m "${ips} source addresses, ${hashes} sample hashes." \
                     -m "Generated by tools/ioc_export.py from the sensor's own telemetry."
          git push
