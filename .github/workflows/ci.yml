name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu 24.04 (noble) is the single supported base, on every runner, in the
  # container and on the VPS. It ships libssh 0.10.6, which is the minimum this
  # project builds against.
  APT_PACKAGES: >-
    build-essential
    cmake
    ninja-build
    pkg-config
    libssl-dev
    libcurl4-openssl-dev
    libssh-dev
    libyaml-cpp-dev
    libmaxminddb-dev
    libminizip-dev

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format

      - name: Safety invariant S1, no process execution primitives
        run: ./scripts/check_no_exec.sh

      - name: Text conventions, no em dash and no committed public address
        run: ./scripts/check_text_rules.sh

      - name: Formatting
        run: |
          mapfile -t files < <(find src include tests -type f \( -name '*.cpp' -o -name '*.hpp' \))
          if [ ${#files[@]} -gt 0 ]; then
            clang-format --dry-run --Werror "${files[@]}"
          fi

  python-checks:
    name: Python tooling
    runs-on: ubuntu-24.04
    # tools/ exports the telemetry, writes the IoC feed and generates the page
    # data. It only ever runs on a schedule, against live data, with nobody
    # watching, so a mistake there is found by the feed going quiet. These are
    # the checks that were missing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the checkers
        run: pip install -r tools/requirements.txt -r tools/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

  build-and-test:
    name: Build ${{ matrix.arch }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04,     compiler: gcc,   preset: release }
          - { arch: x86_64, runner: ubuntu-24.04,     compiler: clang, preset: clang }
          - { arch: arm64,  runner: ubuntu-24.04-arm, compiler: gcc,   preset: release }
          - { arch: arm64,  runner: ubuntu-24.04-arm, compiler: clang, preset: clang }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }}
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang
          fi

      - name: Confirm the libssh version is the supported one
        run: |
          version=$(pkg-config --modversion libssh)
          echo "libssh ${version}"
          # Hard floor. Ubuntu 22.04 and libssh 0.9.x are out of scope by design.
          dpkg --compare-versions "$version" ge 0.10.6 || {
            echo "libssh ${version} is below the supported 0.10.6"; exit 1; }

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sanitizer presets use GCC, whose runtime ships with the compiler.
      # Clang needs libclang-rt-<version>-dev as a separate package, and the
      # sanitizers are equivalent, so clang is kept for the libFuzzer targets
      # where it is actually required.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }}

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset asan

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    # The daemon runs an accept loop per service, a capture worker, a bounded
    # event bus and one sink shared by all of them. ASan cannot see a data
    # race between any two of those, and the preset for this existed from the
    # first commit without anything ever running it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }}

      - name: Configure
        run: cmake --preset tsan

      # setarch -R disables address space randomisation for the child.
      # ThreadSanitizer aborts with "unexpected memory mapping" on a kernel
      # with 32 bits of mmap entropy, which is what Ubuntu 24.04 ships, and
      # it aborts during the build, because gtest_discover_tests runs the
      # binary to enumerate the tests. The usual sysctl workaround needs root
      # on the runner; this one does not.
      - name: Build
        run: setarch -R cmake --build --preset tsan

      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: setarch -R ctest --preset tsan

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: pip install gcovr==8.8

      # The floors live in the script, so the same numbers apply locally.
      - name: Measure
        run: ./scripts/coverage.sh

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            build/coverage/report
            build/coverage/coverage.xml
          retention-days: 14

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libFuzzer needs clang's sanitizer runtime, which is a separate package
      # from clang itself.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }} \
            clang libclang-rt-18-dev

      - name: Configure
        run: cmake --preset fuzz

      - name: Build the fuzz targets
        run: cmake --build --preset fuzz

      # A short fixed budget per target. Enough to catch a regression on a
      # pull request, short enough that nobody starts skipping CI over it.
      # Longer campaigns belong on a schedule, not on every push.
      - name: Fuzz each target for 60 seconds
        run: |
          set -euo pipefail
          for binary in build/fuzz/tests/fuzz/arapuca_fuzz_*; do
            name=$(basename "$binary")
            target=${name#arapuca_fuzz_}
            corpus="tests/fuzz/corpus/${target}"
            mkdir -p "$corpus" "artifacts/${target}"
            echo "::group::${target}"
            "$binary" "$corpus" \
              -max_total_time=60 \
              -max_len=65536 \
              -rss_limit_mb=2048 \
              -artifact_prefix="artifacts/${target}/"
            echo "::endgroup::"
          done

      # A crashing input is the product of this job. Losing it would mean
      # fuzzing the same bug again tomorrow.
      - name: Upload any crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: artifacts/
          retention-days: 30

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }} clang clang-tidy

      - name: Configure
        run: cmake --preset tidy

      - name: Build with clang-tidy enabled
        run: cmake --build --preset tidy
