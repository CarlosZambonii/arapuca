# Netlify deploys the static page in web/ on every push to main.
#
# There is no build step and no Netlify function. The data the page renders is
# web/data/live.json, which a scheduled GitHub Action regenerates from New
# Relic and commits, so the New Relic key lives only in GitHub secrets and
# never reaches a browser or a build log.

[build]
  publish = "web"
  command = ""

[build.environment]
  NODE_VERSION = "20"

# The page is a public invitation to attack the honeypot. These headers are
# about the page itself, which is unrelated to the sensor and should not
# become its own small attack surface.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' 'unsafe-inline'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src https://fonts.gstatic.com; \
      connect-src 'self'; \
      img-src 'self' data:; \
      frame-ancestors 'self'; \
      base-uri 'none'; \
      form-action 'none'"""

# The data file changes every hour, so it must not be cached for longer than
# that or the map shows yesterday while the counters say live.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
