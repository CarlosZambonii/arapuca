# Credentials the fake SSH server accepts.
#
# The list is weak on purpose. A honeypot is interesting exactly when an
# attacker believes a guess worked, so these are the pairs that appear at the
# top of every real world brute force list. Every attempt is recorded whether
# it succeeds or not, and a refused login is as much of a product as an
# accepted one.
#
# Passwords are quoted without exception. Unquoted, YAML would read 123456 as
# a number, and this field has to survive as the exact string the attacker
# typed.
#
# Two wildcards are available:
#   username: "*"   accept this password for any username
#   password: "*"   accept any password for this username

# Accept an attempt regardless of the credential once a source address has
# failed this many times. Real honeypots use this to let a persistent brute
# forcer through eventually, which is where the interesting sessions come
# from. Zero disables it.
accept_after_failures: 0

credentials:
  # The classics, in roughly the order the lists try them.
  - { username: "root",     password: "123456" }
  - { username: "root",     password: "root" }
  - { username: "root",     password: "password" }
  - { username: "root",     password: "admin" }
  - { username: "root",     password: "toor" }
  - { username: "root",     password: "1234" }
  - { username: "root",     password: "12345" }
  - { username: "root",     password: "123456789" }
  - { username: "root",     password: "qwerty" }
  - { username: "root",     password: "" }

  - { username: "admin",    password: "admin" }
  - { username: "admin",    password: "123456" }
  - { username: "admin",    password: "password" }
  - { username: "admin",    password: "admin123" }
  - { username: "admin",    password: "1234" }

  # Default credentials shipped by appliances and IoT firmware, which is what
  # most of the automated traffic is actually looking for.
  - { username: "ubnt",     password: "ubnt" }
  - { username: "pi",       password: "raspberry" }
  - { username: "support",  password: "support" }
  - { username: "user",     password: "user" }
  - { username: "guest",    password: "guest" }
  - { username: "test",     password: "test" }
  - { username: "oracle",   password: "oracle" }
  - { username: "postgres", password: "postgres" }
  - { username: "mysql",    password: "mysql" }
  - { username: "ftp",      password: "ftp" }
  - { username: "git",      password: "git" }
  - { username: "jenkins",  password: "jenkins" }
  - { username: "tomcat",   password: "tomcat" }
  - { username: "nagios",   password: "nagios" }
  - { username: "deploy",   password: "deploy" }
  - { username: "ubuntu",   password: "ubuntu" }
  - { username: "debian",   password: "debian" }
  - { username: "centos",   password: "centos" }

  # Users that exist in the fake filesystem, so a session that reads
  # /etc/passwd and then tries what it found is rewarded. Those sessions are
  # the ones worth reading.
  - { username: "deploy",   password: "deploy2024" }
  - { username: "mdias",    password: "mdias" }
