# Credentials the fake Telnet server accepts.
#
# Different list from the SSH one: Telnet on port 23 is knocked on by IoT
# botnets, not by people, and the pairs they spray are the factory defaults
# baked into cameras, routers and DVRs. These are the ones from Mirai's own
# table and the lists that followed it. Every attempt is recorded whether it
# succeeds or not.
#
# Passwords are quoted without exception, so YAML keeps them as the exact
# string the client sent rather than reading 1234 as a number.

accept_after_failures: 0

